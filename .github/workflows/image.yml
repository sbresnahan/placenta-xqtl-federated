# Build the self-contained offline image.
#
#   push to main touching the image inputs, or manual run  ->  development image
#       ghcr.io/sbresnahan/placenta-xqtl-federated:dev   (unpinned references allowed)
#   tag vX.Y.Z (must equal manifest.version in nextflow.config)  ->  release
#       ghcr.io/sbresnahan/placenta-xqtl-federated:X.Y.Z  (+ :X.Y.Z-cuda)
#       every reference pinned, processed references must equal assets/refs_manifest.tsv;
#       the .sif is pushed as an OCI (ORAS) artifact to ghcr.io/sbresnahan/xqtl-federated-sif:X.Y.Z,
#       archived on Zenodo (secret ZENODO_TOKEN; optional variables ZENODO_CONCEPT_ID and
#       ZENODO_PUBLISH=true), and its checksum + the reference manifest are attached to the
#       GitHub release.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "containers/**"
      - "assets/refs_sources.tsv"
      - "assets/refs_manifest.tsv"
      - "scripts/fetch_references.sh"
      - ".github/workflows/image.yml"
  workflow_dispatch:
    inputs:
      cuda:
        description: "also build the -cuda variant"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sbresnahan/placenta-xqtl-federated
  SIF_REPO: ghcr.io/sbresnahan/xqtl-federated-sif

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    steps:
      - name: Decide what to build
        id: plan
        env:
          VARIANT: ${{ matrix.variant }}
          WANT_CUDA: ${{ inputs.cuda }}
        run: |
          release=false; build=true
          if [ "$GITHUB_REF_TYPE" = tag ]; then release=true; fi
          if [ "$VARIANT" = cuda ] && [ "$release" = false ] && [ "$WANT_CUDA" != true ]; then build=false; fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: steps.plan.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4
        if: steps.plan.outputs.build == 'true'

      - name: Version
        if: steps.plan.outputs.build == 'true'
        id: ver
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          VARIANT: ${{ matrix.variant }}
        run: |
          v=$(sed -n "s/^[[:space:]]*version[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" nextflow.config | awk 'NR==1')
          suffix=""; [ "$VARIANT" = cuda ] && suffix="-cuda"
          if [ "$RELEASE" = true ]; then
            if [ "$GITHUB_REF_NAME" != "v$v" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match manifest.version $v in nextflow.config"; exit 1
            fi
            tag="$v$suffix"
          else
            v="$v+$(git rev-parse --short HEAD)"; tag="dev$suffix"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache downloaded references
        if: steps.plan.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: refs_cache
          key: refs-${{ hashFiles('assets/refs_sources.tsv') }}
          restore-keys: refs-

      - uses: r-lib/actions/setup-pandoc@v2
        if: steps.plan.outputs.build == 'true'
        with:
          pandoc-version: "3.2"
      - uses: r-lib/actions/setup-r@v2
        if: steps.plan.outputs.build == 'true'
        with:
          r-version: "4.4"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.plan.outputs.build == 'true'
        with:
          packages: |
            any::bookdown
            any::rmarkdown
            any::knitr

      - uses: docker/setup-buildx-action@v3
        if: steps.plan.outputs.build == 'true'
      - uses: docker/login-action@v3
        if: steps.plan.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        if: steps.plan.outputs.build == 'true'
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          args=(--variant "$VARIANT" --version "$VERSION" --tag "$IMAGE:$TAG" --refs-cache refs_cache)
          [ "$RELEASE" = true ] && args+=(--release)
          containers/build_image.sh "${args[@]}"

      - name: Self-checks in the image
        if: steps.plan.outputs.build == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          docker run --rm "$IMAGE:$TAG" versions | tee versions.tsv
          docker run --rm "$IMAGE:$TAG" refs-check
          docker run --rm "$IMAGE:$TAG" cat /opt/xqtl/refs/MANIFEST.tsv > refs_MANIFEST.tsv
          if ! diff -q <(grep -v '^#' assets/refs_manifest.tsv) <(grep -v '^#' refs_MANIFEST.tsv) > /dev/null; then
            echo "::warning title=reference manifest::processed references differ from assets/refs_manifest.tsv (commit refs_MANIFEST.tsv from the artifact before tagging a release)"
          fi

      - name: Push image
        if: steps.plan.outputs.build == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: docker push "$IMAGE:$TAG"

      - name: Upload manifests
        if: steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manifests-${{ matrix.variant }}
          path: |
            refs_MANIFEST.tsv
            versions.tsv

      # ---------------- release only: SIF, ORAS, Zenodo, GitHub release ----------------
      - uses: eWaterCycle/setup-apptainer@v2
        if: steps.plan.outputs.release == 'true'
        with:
          apptainer-version: 1.3.6

      - name: Build the SIF
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          sif="xqtl-federated_${TAG}.sif"
          apptainer build "$sif" "docker-daemon://$IMAGE:$TAG"
          docker image rm "$IMAGE:$TAG"
          sha256sum "$sif" > "$sif.sha256"
          apptainer exec "$sif" /opt/xqtl/pipeline/containers/entrypoint.sh versions > /dev/null
          ls -l "$sif"; cat "$sif.sha256"

      - name: Push the SIF to GHCR (OCI artifact; sites run apptainer pull oras://...)
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | apptainer registry login -u "$GH_ACTOR" --password-stdin oras://ghcr.io
          apptainer push "xqtl-federated_${TAG}.sif" "oras://$SIF_REPO:$TAG"

      - name: Archive the SIF on Zenodo
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_CONCEPT_ID: ${{ vars.ZENODO_CONCEPT_ID }}
          ZENODO_PUBLISH: ${{ vars.ZENODO_PUBLISH }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "::warning title=Zenodo::ZENODO_TOKEN is not set; the SIF was not archived"; exit 0
          fi
          args=(--version "$TAG")
          [ -n "$ZENODO_CONCEPT_ID" ] && args+=(--concept "$ZENODO_CONCEPT_ID")
          [ "$ZENODO_PUBLISH" = true ] && args+=(--publish)
          scripts/zenodo_upload.sh "${args[@]}" "xqtl-federated_${TAG}.sif" "xqtl-federated_${TAG}.sif.sha256"

      - name: Attach checksum and manifests to the GitHub release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cp refs_MANIFEST.tsv "refs_MANIFEST_${TAG}.tsv"; cp versions.tsv "VERSIONS_${TAG}.tsv"
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "xqtl-federated_${TAG}.sif.sha256" "refs_MANIFEST_${TAG}.tsv" "VERSIONS_${TAG}.tsv"
