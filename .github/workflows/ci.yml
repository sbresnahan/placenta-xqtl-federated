# Continuous integration: unit tests, configuration and syntax checks, linters, and the
# site validation checks inside the development image (when that image exists).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NXF_VER: "26.10.4"
  NXF_OFFLINE: "false"
  DEV_IMAGE: ghcr.io/sbresnahan/placenta-xqtl-federated:dev

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # samtools/tabix let the reference-build tests run; tests that need plink2 skip
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends samtools tabix
          python -m pip install --quiet -r tests/requirements-ci.txt
      - name: pytest (image versions, tests/requirements-ci.txt)
        run: python -m pytest -q -rs tests/unit
      - name: pytest (latest pandas/pyarrow/numpy)
        # guards against dtype changes such as pandas 3 'str' columns
        run: |
          python -m pip install --quiet --upgrade pandas pyarrow numpy
          python -m pytest -q -rs tests/unit

  checks:
    name: configs, lint, shell, Dockerfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}
      - name: Every profile resolves
        run: scripts/check_configs.sh
      - name: nextflow lint
        run: nextflow lint .
      - name: Scripts are executable
        run: |
          bad=$(git ls-files -s -- 'bin/*' 'scripts/*.sh' 'scripts/*.py' 'containers/*.sh' 'tests/scripts/*.sh' \
                | awk '$1 != "100755" {print $4}' | grep -v '__pycache__' || true)
          if [ -n "$bad" ]; then echo "not executable in git:"; echo "$bad"; exit 1; fi
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -S warning containers/*.sh scripts/*.sh book/publish_pages.sh \
            assets/head_job/*.sh bin/*.sh tests/scripts/*.sh
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: containers/Dockerfile
          config: .hadolint.yaml
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  test-profile:
    name: image checks (development image)
    runs-on: ubuntu-24.04
    needs: [unit, checks]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the development image
        id: pull
        run: |
          if docker pull "$DEV_IMAGE"; then echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=test profile skipped::$DEV_IMAGE is not published yet (built by .github/workflows/image.yml)"
          fi
      - name: Image self-checks
        if: steps.pull.outputs.available == 'true'
        run: |
          docker run --rm "$DEV_IMAGE" versions
          docker run --rm "$DEV_IMAGE" refs-check
      - name: Site validation checks in the image (smoke profile)
        if: steps.pull.outputs.available == 'true'
        run: |
          nextflow run . -profile local,docker,smoke --image "$DEV_IMAGE" \
            --restricted tests/fixtures/xqtl-restricted-test.tar.gz
          grep -P '^VERDICT\tGO\t' xqtl_smoke/smoke/smoke_summary.tsv
      - name: Site run end to end (chr22 fixture -> export A-J, planted signals, leak scan)
        if: steps.pull.outputs.available == 'true'
        env:
          NXF_OPTS_EXTRA: --image ${{ env.DEV_IMAGE }}
        run: |
          python3 -m pip install --quiet -r tests/requirements-ci.txt
          tests/scripts/test_site.sh "$PWD/site_test" docker
      - name: Central run end to end (two cohorts -> meta, fine-mapping, coloc, G x C / GxE, TWAS inputs)
        if: steps.pull.outputs.available == 'true'
        env:
          NXF_OPTS_EXTRA: --image ${{ env.DEV_IMAGE }}
        run: |
          # development images built before the central release lack the SuShiE environment
          if ! docker run --rm --entrypoint bash "$DEV_IMAGE" -c 'command -v sushie-python' > /dev/null; then
            echo "::notice::development image lacks SuShiE; central test skipped"
            exit 0
          fi
          # the R recalculation runs in the image (data.table); the workspace is mounted at the same path
          # shellcheck disable=SC2016  # $PWD and $@ are expanded when the wrapper runs
          printf '#!/usr/bin/env bash\nexec docker run --rm -v "%s:%s" -w "$PWD" --entrypoint Rscript "%s" "$@"\n' \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$DEV_IMAGE" > "$RUNNER_TEMP/rscript"
          chmod +x "$RUNNER_TEMP/rscript"
          RSCRIPT="$RUNNER_TEMP/rscript" tests/scripts/test_central.sh "$PWD/central_test" docker "$PWD/site_test"
      - name: Phenotyping end to end (chr22 SNUH FASTQs -> site indices -> phenotype BEDs)
        if: steps.pull.outputs.available == 'true'
        env:
          NXF_OPTS_EXTRA: --image ${{ env.DEV_IMAGE }}
        run: |
          # development images built before the phenotyping release lack Picard / the IRFinder-S patch
          if ! docker run --rm --entrypoint bash "$DEV_IMAGE" -c 'command -v picard' > /dev/null; then
            echo "::notice::development image predates phenotyping support; phenotyping test skipped"
            exit 0
          fi
          mkdir -p "$PWD/pheno_test"
          docker run --rm --entrypoint bash "$DEV_IMAGE" -c \
            "gzip -cdf /opt/xqtl/refs/genome/GRCh38_no_alt_analysis_set.fa.gz | awk '/^>/{p = (\$1 == \">chr22\")} p'" \
            > "$PWD/pheno_test/chr22.fa"
          XQTL_CHR22_FA="$PWD/pheno_test/chr22.fa" tests/scripts/test_phenotyping.sh "$PWD/pheno_test" docker
      - name: Imputation prep end to end (GRCh37 VCF liftover, GRCh38 PLINK allele swap, wrong-build stop)
        if: steps.pull.outputs.available == 'true'
        env:
          NXF_OPTS_EXTRA: --image ${{ env.DEV_IMAGE }}
        run: |
          if ! docker run --rm --entrypoint bash "$DEV_IMAGE" -c 'command -v picard' > /dev/null; then
            echo "::notice::development image lacks Picard; imputation_prep test skipped"
            exit 0
          fi
          mkdir -p "$PWD/ip_test"
          if [ -s "$PWD/pheno_test/chr22.fa" ]; then cp "$PWD/pheno_test/chr22.fa" "$PWD/ip_test/chr22.fa"; else
            docker run --rm --entrypoint bash "$DEV_IMAGE" -c \
              "gzip -cdf /opt/xqtl/refs/genome/GRCh38_no_alt_analysis_set.fa.gz | awk '/^>/{p = (\$1 == \">chr22\")} p'" \
              > "$PWD/ip_test/chr22.fa"
          fi
          XQTL_CHR22_FA="$PWD/ip_test/chr22.fa" tests/scripts/test_imputation_prep.sh "$PWD/ip_test" docker
      - name: Upload test outputs
        if: always() && steps.pull.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-profile-results
          path: |
            xqtl_smoke/
            .nextflow.log
            site_test/*.log
            site_test/results_test/pipeline_info/
            site_test/.nextflow.log
            central_test/*/*.log
            central_test/*/.nextflow.log
            central_test/central/ivw_check/
            central_test/central/results_central/central/summary/
          retention-days: 7
